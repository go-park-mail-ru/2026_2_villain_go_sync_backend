syntax = "proto3";

package vacancy.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_2_villain_go_sync_backend/gen/go/vacancy/v1;vacancyv1";

service VacancyService {
  rpc CreateVacancy(CreateVacancyRequest) returns (CreateVacancyResponse);

  rpc UpdateVacancy(UpdateVacancyRequest) returns (UpdateVacancyResponse);

  rpc GetVacancy(GetVacancyRequest) returns (GetVacancyResponse);

  rpc DeleteVacancy(DeleteVacancyRequest) returns (google.protobuf.Empty);

  rpc ListVacancies(ListVacanciesRequest) returns (ListVacanciesResponse);

  rpc ListEmployerVacancies(ListEmployerVacanciesRequest) returns (ListEmployerVacanciesResponse);

  rpc ListCategories(google.protobuf.Empty) returns (ListCategoriesResponse);
}

service CompanyService {
  rpc GetCompanyProfile(GetCompanyProfileRequest) returns (GetCompanyProfileResponse);

  rpc UpdateCompanyProfile(UpdateCompanyProfileRequest) returns (UpdateCompanyProfileResponse);

  rpc UploadCompanyLogo(UploadCompanyLogoRequest) returns (google.protobuf.Empty);

  rpc GetCompanyLogo(GetCompanyLogoRequest) returns (GetCompanyLogoResponse);

  rpc DeleteCompanyLogo(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message GetVacancyRequest {
  int64 id = 1;
}

message DeleteVacancyRequest {
  int64 vacancy_id = 1;
}

message CreateVacancyRequest {
  string title = 1;
  string description = 2;
  string responsibilities = 3;
  string requirements = 4;
  optional double salary_from = 5;
  optional double salary_to = 6;
  string currency = 7;
  optional string offer = 8;
  optional string experience_level = 9;
  optional string employment_type = 10;
  optional string work_format = 11;
  optional string work_schedule = 12;
  optional string work_hours = 13;
  optional string city = 14;
  optional string office_address = 15;
  repeated int64 category_ids = 16;
}

message CreateVacancyResponse {
  Vacancy vacancy = 1;
}

message UpdateVacancyRequest {
  int64 vacancy_id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string responsibilities = 4;
  optional string requirements = 5;
  SalaryUpdate salary_from = 6;
  SalaryUpdate salary_to = 7;
  optional string currency = 8;
  optional string offer = 9;
  optional string experience_level = 10;
  optional string employment_type = 11;
  optional string work_format = 12;
  optional string work_schedule = 13;
  optional string work_hours = 14;
  optional string city = 15;
  optional string office_address = 16;
  CategoryIDs category_ids = 17;
}

message SalaryUpdate {
  oneof change {
    double value = 1;
    google.protobuf.NullValue clear = 2;
  }
}

message CategoryIDs {
  repeated int64 ids = 1;
}

message UpdateVacancyResponse {
  Vacancy vacancy = 1;
}

message GetVacancyResponse {
  Vacancy vacancy = 1;
}

message ListVacanciesRequest {
  optional int32 limit = 1;
  optional string cursor = 2;
}

message ListVacanciesResponse {
  repeated Vacancy items = 1;
  Pagination pagination = 2;
}

message ListEmployerVacanciesRequest {
  optional int32 limit = 1;
  optional string cursor = 2;
}

message ListEmployerVacanciesResponse {
  repeated Vacancy items = 1;
  Pagination pagination = 2;
}

message Pagination {
  int32 limit = 1;
  int64 total = 2;
  optional string next_cursor = 3;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

message Category {
  int64 id = 1;
  string name = 2;
}

message Vacancy {
  int64 id = 1;
  int32 version = 2;
  string title = 3;
  optional string apply_until = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp changed_at = 7;
  repeated string categories = 8;
  Company company = 9;
  Content content = 10;
  Requirements requirements = 11;
  Salary salary = 12;
  Conditions conditions = 13;
  Location location = 14;

  message Company {
    int64 employer_id = 1;
    string name = 2;
    optional string logo_url = 3;
  }

  message Content {
    string description = 1;
    string responsibilities = 2;
  }

  message Requirements {
    string description = 1;
    optional string experience_level = 2;
  }

  message Salary {
    optional double salary_from = 1;
    optional double salary_to = 2;
    string currency = 3;
  }

  message Conditions {
    optional string offer = 1;
    optional string employment_type = 2;
    optional string work_format = 3;
    optional string work_schedule = 4;
    optional string work_hours = 5;
  }

  message Location {
    optional string city = 1;
    optional string office_address = 2;
  }
}

message GetCompanyProfileRequest {
  int64 employer_id = 1;
}

message GetCompanyProfileResponse {
  CompanyProfile profile = 1;
}

message UpdateCompanyProfileRequest {
  string company_name = 1;
  string description = 2;
  string website = 3;
  optional string industry = 4;
  optional string team_size = 5;
  optional string main_city = 6;
  optional string benefits = 7;
  optional string hiring_email = 8;
  optional string office_address = 9;
  repeated Technology technologies = 10;
  repeated CultureItem culture = 11;
}

message UpdateCompanyProfileResponse {
  CompanyProfile profile = 1;
}

message CompanyProfile {
  Profile profile = 1;
  Company company = 2;
  Contacts contacts = 3;
  Location location = 4;
  Details details = 5;

  message Profile {
    int64 user_id = 1;
    string description = 2;
    google.protobuf.Timestamp created_at = 3;
    google.protobuf.Timestamp updated_at = 4;
  }

  message Company {
    string company_name = 1;
    optional string industry = 2;
    optional string team_size = 3;
    optional string benefits = 4;
    optional string logo_url = 5;
  }

  message Contacts {
    string website = 1;
    optional string hiring_email = 2;
  }

  message Location {
    optional string main_city = 1;
    optional string office_address = 2;
  }

  message Details {
    repeated Technology technologies = 1;
    repeated CultureItem culture = 2;
  }
}

message Technology {
  string name = 1;
}

message CultureItem {
  optional string title = 1;
  optional string short_description = 2;
  optional string description = 3;
}

message UploadCompanyLogoRequest {
  bytes content = 1;
  string content_type = 2;
}

message GetCompanyLogoRequest {
  int64 employer_id = 1;
}

message GetCompanyLogoResponse {
  bytes content = 1;
  string content_type = 2;
}
