syntax = "proto3";

package seeker.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-park-mail-ru/2026_2_villain_go_sync_backend/gen/go/seeker/v1;seekerv1";

service SeekerService {
  rpc GetSeekerProfile(GetSeekerProfileRequest) returns (GetSeekerProfileResponse);

  rpc UpdateSeekerProfile(UpdateSeekerProfileRequest) returns (UpdateSeekerProfileResponse);

  rpc UploadSeekerAvatar(UploadSeekerAvatarRequest) returns (google.protobuf.Empty);

  rpc GetSeekerAvatar(GetSeekerAvatarRequest) returns (GetSeekerAvatarResponse);

  rpc DeleteSeekerAvatar(google.protobuf.Empty) returns (google.protobuf.Empty);
}

service ResumeService {
  rpc CreateResume(CreateResumeRequest) returns (CreateResumeResponse);

  rpc UpdateResume(UpdateResumeRequest) returns (UpdateResumeResponse);

  rpc DeleteResume(DeleteResumeRequest) returns (google.protobuf.Empty);

  rpc GetResume(GetResumeRequest) returns (GetResumeResponse);

  rpc ListResumes(ListResumesRequest) returns (ListResumesResponse);
}

message GetSeekerProfileRequest {
  int64 seeker_id = 1;
}

message GetSeekerProfileResponse {
  SeekerProfile profile = 1;
}

message UpdateSeekerProfileRequest {
  string first_name = 1;
  string last_name = 2;
  string phone = 3;
  string description = 4;
  optional string city = 5;
  optional string messenger = 6;
  optional string contact_email = 7;
  optional string preferred_position = 8;
  optional string preferred_cities = 9;
  optional string work_format = 10;
  CareerInput career = 11;
}

message UpdateSeekerProfileResponse {
  SeekerProfile profile = 1;
}

message SeekerProfile {
  Profile profile = 1;
  PersonalInfo personal_info = 2;
  Contacts contacts = 3;
  Preferences preferences = 4;
  CareerDetails career = 5;

  message Profile {
    int64 user_id = 1;
    string description = 2;
    google.protobuf.Timestamp created_at = 3;
    google.protobuf.Timestamp updated_at = 4;
  }

  message PersonalInfo {
    string first_name = 1;
    string last_name = 2;
    optional string city = 3;
    optional string avatar_url = 4;
  }

  message Contacts {
    string phone = 1;
    optional string messenger = 2;
    optional string contact_email = 3;
  }

  message Preferences {
    optional string preferred_position = 1;
    optional string preferred_cities = 2;
    optional string work_format = 3;
  }
}

message CareerDetails {
  repeated ExperienceItem experience_items = 1;
  repeated EducationItem education_items = 2;
  repeated Skill skills = 3;
  repeated ProjectItem projects = 4;
}

message CareerInput {
  ExperienceItems experience_items = 1;
  EducationItems education_items = 2;
  Skills skills = 3;
  ProjectItems projects = 4;
}

message ExperienceItems {
  repeated ExperienceItem items = 1;
}

message EducationItems {
  repeated EducationItem items = 1;
}

message Skills {
  repeated Skill items = 1;
}

message ProjectItems {
  repeated ProjectItem items = 1;
}

message ExperienceItem {
  optional string company_name = 1;
  optional string position_title = 2;
  optional string started_on = 3;
  optional string ended_on = 4;
  bool is_current = 5;
  optional string achievements = 6;
}

message EducationItem {
  optional string record_type = 1;
  optional string institution = 2;
  optional int32 completion_year = 3;
  optional string specialization = 4;
}

message Skill {
  string name = 1;
}

message ProjectItem {
  optional string title = 1;
  optional string url = 2;
  optional string description = 3;
}

message UploadSeekerAvatarRequest {
  bytes content = 1;
  string content_type = 2;
}

message GetSeekerAvatarRequest {
  int64 seeker_id = 1;
}

message GetSeekerAvatarResponse {
  bytes content = 1;
  string content_type = 2;
}

message CreateResumeRequest {
  ResumeInput resume = 1;
  optional double salary_from = 2;
}

message CreateResumeResponse {
  Resume resume = 1;
}

message UpdateResumeRequest {
  int64 resume_id = 1;
  ResumeInput resume = 2;

  oneof salary_change {
    double salary_from = 3;
    google.protobuf.NullValue clear_salary_from = 4;
  }
}

message UpdateResumeResponse {
  Resume resume = 1;
}

message DeleteResumeRequest {
  int64 resume_id = 1;
}

message GetResumeRequest {
  int64 resume_id = 1;
}

message GetResumeResponse {
  Resume resume = 1;
}

message ListResumesRequest {
  int64 seeker_id = 1;
}

message ListResumesResponse {
  repeated Resume items = 1;
}

message ResumeInput {
  string title = 1;
  Resume.Content content = 2;
  string target_position = 3;
  optional string city = 4;
  optional string employment_type = 5;
  optional string work_format = 6;
  optional string work_schedule = 7;
  CareerInput career = 8;
}

message Resume {
  int64 id = 1;
  int64 seeker_id = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  Content content = 6;
  Preferences preferences = 7;
  CareerDetails career = 8;

  message Content {
    string description = 1;
    string experience = 2;
    string education = 3;
    optional string portfolio_url = 4;
    optional string languages = 5;
  }

  message Preferences {
    optional string target_position = 1;
    optional string city = 2;
    optional string employment_type = 3;
    optional string work_format = 4;
    optional string work_schedule = 5;
    optional double salary_from = 6;
  }
}
