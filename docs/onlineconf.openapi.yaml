openapi: 3.1.0
info:
  title: HireNoon OnlineConf
  version: 1.0.0
  description: Административный API OnlineConf и внутренний снимок. Успешные ответы с телом содержат data, ошибки
    содержат error. PUT для scope, конфигураций и флагов заменяет изменяемые поля полностью. Административная роль
    определяется в OnlineConf по ID из access JWT.
security:
- AccessCookie: []
externalDocs:
  description: Регламенты раскатки, группы и права
  url: ./onlineconf-advanced.md
paths:
  /api/onlineconf/admin/me:
    get:
      operationId: getCurrentAdmin
      summary: Получить текущего администратора
      responses:
        '200':
          description: Успешный ответ.
          headers:
            X-Request-ID:
              description: Идентификатор запроса.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Admin'
                required:
                - data
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/onlineconf/admin/scopes:
