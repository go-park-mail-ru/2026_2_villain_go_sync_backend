        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createScope
      summary: Создать scope
      security:
      - AccessCookie: []
        CsrfCookie: []
        CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopeCreate'
      responses:
        '201':
          description: Ресурс создан.
          headers:
            X-Request-ID:
              description: Идентификатор запроса.
              schema:
                type: string
          content:
            application/json:
              schema:
