components:
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Подписанный access JWT продуктовой авторизации.
    CsrfCookie:
      type: apiKey
      in: cookie
      name: csrf_token
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Значение должно совпадать с cookie csrf_token.
    SnapshotBearer:
      type: http
      scheme: bearer
      description: Отдельный межсервисный секрет ONLINECONF_SNAPSHOT_SECRET.
  parameters:
    ID:
      name: id
      in: path
      description: Идентификатор ресурса.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserID:
      name: user_id
      in: path
      description: Идентификатор продуктового пользователя.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      description: Размер страницы.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Передайте next_cursor предыдущей страницы с теми же фильтрами.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    ScopeID:
      name: scope_id
      in: query
      description: Фильтр по идентификатору scope.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    KeyType:
      name: type
      in: query
      description: Фильтр по типу ключа.
      required: false
      schema:
        type: string
        enum:
        - config
        - feature_flag
    Search:
      name: search
      in: query
      description: Поиск по части имени без учёта регистра. Строка с точкой сравнивается с полным именем scope.key.
      required: false
      schema:
        type: string
    ResourceID:
      name: resource_id
      in: query
      description: Фильтр по идентификатору ресурса.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    ResourceType:
      name: resource_type
      in: query
      description: Фильтр по типу ресурса.
      required: false
      schema:
        type: string
        enum:
        - scope
        - config
        - feature_flag
        - feature_flag_override
        - admin
    ScopeName:
      name: scope_name
      in: query
      description: Фильтр по имени scope в записи истории.
      required: false
      schema:
        type: string
        minLength: 1
    EvaluationUser:
      name: user_id
      in: query
      description: Идентификатор существующего продуктового пользователя.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Некорректные параметры или JSON запроса.
      headers:
        X-Request-ID:
          description: Идентификатор запроса.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Авторизация отсутствует или не прошла проверку.
      headers:
        X-Request-ID:
          description: Идентификатор запроса.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав или не прошла проверка CSRF.
      headers:
        X-Request-ID:
          description: Идентификатор запроса.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден.
      headers:
        X-Request-ID:
          description: Идентификатор запроса.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт данных или конкурентное изменение. Операцию можно повторить после чтения актуального
        состояния.
      headers:
        X-Request-ID:
          description: Идентификатор запроса.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Запрос не прошёл валидацию. Возможные причины включают отсутствующее поле, неизвестного продуктового
        пользователя или попытку убрать последнего владельца.
      headers:
        X-Request-ID:
          description: Идентификатор запроса.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Внутренняя ошибка.
      headers:
        X-Request-ID:
          description: Идентификатор запроса.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Необходимая зависимость недоступна.
      headers:
        X-Request-ID:
          description: Идентификатор запроса.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Scope:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        description:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - created_at
      - updated_at
      additionalProperties: false
    ScopeCreate:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        description:
          type:
          - string
          - 'null'
      required:
      - name
      additionalProperties: false
    ScopeReplace:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        description:
          type:
          - string
          - 'null'
      required:
      - name
      - description
      additionalProperties: false
    Key:
      oneOf:
      - $ref: '#/components/schemas/Config'
      - $ref: '#/components/schemas/FeatureFlag'
    Config:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        scope_id:
          type: integer
          format: int64
          minimum: 1
        scope_name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        full_name:
          type: string
          example: frontend.banner
        description:
          type:
          - string
          - 'null'
        type:
          type: string
          const: config
        owner_user_id:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        value:
          description: Любое JSON-значение, включая null.
      required:
      - id
      - scope_id
      - scope_name
      - name
      - full_name
      - description
      - type
      - owner_user_id
      - created_at
      - updated_at
      - value
      additionalProperties: false
    ConfigCreate:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        description:
          type:
          - string
          - 'null'
        scope_id:
          type: integer
          format: int64
          minimum: 1
        owner_user_id:
          type: integer
          format: int64
          minimum: 1
        value:
          description: Любое JSON-значение, включая null.
      required:
      - scope_id
      - owner_user_id
      - name
      - value
      additionalProperties: false
    ConfigReplace:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        description:
          type:
          - string
          - 'null'
        scope_id:
          type: integer
          format: int64
          minimum: 1
        owner_user_id:
          type: integer
          format: int64
          minimum: 1
        value:
          description: Любое JSON-значение, включая null.
      required:
      - scope_id
      - owner_user_id
      - name
      - description
      - value
      additionalProperties: false
    FeatureFlag:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        scope_id:
          type: integer
          format: int64
          minimum: 1
        scope_name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        full_name:
          type: string
          example: frontend.banner
        description:
          type:
          - string
          - 'null'
        type:
          type: string
          const: feature_flag
        owner_user_id:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
      required:
      - id
      - scope_id
      - scope_name
      - name
      - full_name
      - description
      - type
      - owner_user_id
      - created_at
      - updated_at
      - enabled
      - rollout_percentage
      additionalProperties: false
    FlagCreate:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        description:
          type:
          - string
          - 'null'
        scope_id:
          type: integer
          format: int64
          minimum: 1
        owner_user_id:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
          default: false
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
      required:
      - scope_id
      - owner_user_id
      - name
      additionalProperties: false
    FlagReplace:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        description:
          type:
          - string
          - 'null'
        scope_id:
          type: integer
          format: int64
          minimum: 1
        owner_user_id:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
      required:
      - scope_id
      - owner_user_id
      - name
      - description
      - enabled
      - rollout_percentage
      additionalProperties: false
    EnabledInput:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
      additionalProperties: false
    RolloutInput:
      type: object
      properties:
        rollout_percentage:
          type: integer
          minimum: 0
          maximum: 100
      required:
      - rollout_percentage
      additionalProperties: false
    Override:
