      operationId: replaceScope
      summary: Заменить scope
      description: Полная замена изменяемых полей. Укажите все обязательные поля. Чтобы очистить описание, передайте
        null.
      security:
      - AccessCookie: []
        CsrfCookie: []
        CsrfHeader: []
      parameters:
      - $ref: '#/components/parameters/ID'
