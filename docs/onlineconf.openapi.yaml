      properties:
        key_id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - key_id
      - user_id
      - enabled
      - created_at
      - updated_at
      additionalProperties: false
    Evaluation:
      type: object
      properties:
