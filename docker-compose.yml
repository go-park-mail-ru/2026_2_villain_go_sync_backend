services:
  postgres:
    image: postgres:17-alpine
    container_name: villain-postgres
    environment:
      POSTGRES_DB: villain
      POSTGRES_USER: villain
      POSTGRES_PASSWORD: villain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U villain -d villain"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: